[tools]
rust = "1.97.1"
go = "1.26.7"
python = "3.13.7"
ripgrep = "15.2.0"
buf = "1.72.0"

[env]
RUST_BACKTRACE = "1"
PYTHONDONTWRITEBYTECODE = "1"

[tasks.check]
description = "Run format, lint, unit, binding, and conformance checks"
run = [
  "cargo fmt --all -- --check",
  "sh tools/check-agent-proto.sh",
  "python3 tools/check-project-license.py",
  "python3 tools/check-implementation-requirements.py",
  "python3 tools/check-selected-node-dependency-boundary.py",
  "python3 tools/check-netlink-packet-core-patch.py",
  "sh tools/test-netlink-packet-core-patch.sh",
  "python3 tools/check-retained-libp2p-oracle-boundary.py",
  "python3 tools/test-retained-libp2p-oracle-boundary.py",
  "sh ./tools/check-dependency-exception-scope.sh",
  "sh ./tools/test-dependency-exception-scope.sh",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo test --locked --workspace --all-features",
  "cargo build --locked -p aster-ffi",
  "cc -std=c11 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.c",
  "c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ibindings/c -fsyntax-only bindings/c/header_smoke.cpp",
  "cargo run --locked -p aster-conformance -- --self-test",
  "python3 conformance/python_wire_oracle.py conformance/vectors/wire-v1.tsv",
  "mise run conformance-profile-v0-r2",
  "python3 -m unittest discover -s bindings/python/tests",
  "python3 -m unittest discover -s lab/tests",
  "test -z \"$(gofmt -l bindings/go)\"",
  "GOCACHE=/tmp/aster-mesh-go-cache go -C bindings/go test -tags aster_workspace ./...",
]

[tasks.conformance-profile-v0-r2]
description = "Verify the standalone candidate-neutral v0-r2 conformance corpus"
run = [
  "cargo fmt --manifest-path conformance/evaluation-v0/runner/Cargo.toml -- --check",
  "cargo test --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml",
  "cargo clippy --locked --offline --manifest-path conformance/evaluation-v0/runner/Cargo.toml --all-targets -- -D warnings",
  "python3 conformance/evaluation-v0/check_v0_r2.py",
]

[tasks.fuzz-smoke]
description = "Run bounded sanitizer-instrumented decoder fuzz campaigns"
run = "sh ./tools/run-fuzz-smoke.sh"

[tasks.tour]
description = "Run the fastest two-node causal Ping/Pong capability tour"
run = "sh ./tools/aster-tour.sh quick"

[tasks.tour-relay]
description = "Run the three-node payload-blind relay capability tour"
run = "sh ./tools/aster-tour.sh relay"

[tasks.tour-control]
description = "Run the four-node revocation and rekey capability tour"
run = "sh ./tools/aster-tour.sh control"

[tasks.reconcile-bakeoff]
description = "Gate the non-production reconciliation matrix through 1,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=1000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-scale]
description = "Gate the opt-in reconciliation matrix through 10,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=10000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-scale-report]
description = "Run the algorithm-error-tolerant 10,000-item diagnostic"
run = "ASTER_BAKEOFF_MAX_ITEMS=10000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=1 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-full]
description = "Gate the opt-in reconciliation matrix through 100,000 items"
run = "ASTER_BAKEOFF_MAX_ITEMS=100000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=0 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.reconcile-bakeoff-full-report]
description = "Run the algorithm-error-tolerant 100,000-item diagnostic"
run = "ASTER_BAKEOFF_MAX_ITEMS=100000 ASTER_BAKEOFF_ALLOW_ALGORITHM_ERRORS=1 cargo test --release --locked -p aster-lab --test reconciliation_bakeoff emit_reconciliation_bakeoff_matrix -- --ignored --nocapture"

[tasks.dependency-exception-scope]
description = "Verify active pilot and lock-only advisory dispositions cannot escape their reviewed graphs"
run = [
  "sh ./tools/check-dependency-exception-scope.sh",
  "sh ./tools/test-dependency-exception-scope.sh",
]

[tasks.retained-oracle-boundary]
description = "Verify the rejected libp2p provider remains an unpublished, opt-in lab oracle"
run = [
  "python3 tools/check-retained-libp2p-oracle-boundary.py",
  "python3 tools/test-retained-libp2p-oracle-boundary.py",
]

[tasks.age-reference-interop]
description = "Verify bidirectional interoperability with official Go age v1.3.1"
run = "sh ./tools/age-reference/check.sh"

[tasks.age-reference-audit]
description = "Audit the Go age oracle with exact govulncheck v1.6.0"
run = "sh ./tools/age-reference/audit.sh"
