x-node: &node
  image: ${ASTER_LAN_MVP_IMAGE:-aster-lan-mvp:local}
  user: "10001:10001"
  init: true
  read_only: true
  restart: "no"
  command: ["/usr/local/libexec/aster/agent-entrypoint.sh"]
  environment:
    ASTER_STATE_DIR: /state
    ASTER_NEARBY_WINDOW: "3"
    ASTER_SYNC_MS: "500"
    HOME: /tmp
    PYTHONDONTWRITEBYTECODE: "1"
  networks: [mesh]
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=10001,gid=10001
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_signal: SIGINT
  stop_grace_period: 15s
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        python3 /usr/local/libexec/aster/aster_lan_mvp.py status
        --token-file "$${ASTER_STATE_DIR}/client.token"
        --url http://127.0.0.1:8181 >/dev/null 2>&1
    interval: 1s
    timeout: 3s
    retries: 45
    start_period: 2s
  logging:
    driver: json-file
    options:
      max-size: 2m
      max-file: "2"

services:
  init:
    image: ${ASTER_LAN_MVP_IMAGE:-aster-lan-mvp:local}
    build:
      context: ../..
      dockerfile: docker/lan-mvp/Dockerfile
    profiles: [setup]
    network_mode: none
    user: "0:0"
    read_only: true
    command: ["/usr/local/libexec/aster/init-state.sh"]
    tmpfs:
      - /seed:rw,nosuid,nodev,noexec,size=8m,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=0700
    volumes:
      - a-state:/nodes/a
      - b-state:/nodes/b
      - c-state:/nodes/c
      - d-state:/nodes/d
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true

  a:
    <<: *node
    environment:
      ASTER_STATE_DIR: /state
      ASTER_DISCOVER_LAN: ${ASTER_A_DISCOVER_LAN:-1}
      ASTER_NEARBY_WINDOW: "3"
      ASTER_SYNC_MS: "500"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - a-state:/state

  b:
    <<: *node
    environment:
      ASTER_STATE_DIR: /state
      ASTER_DISCOVER_LAN: ${ASTER_B_DISCOVER_LAN:-1}
      ASTER_NEARBY_WINDOW: "3"
      ASTER_SYNC_MS: "500"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - b-state:/state

  c:
    <<: *node
    environment:
      ASTER_STATE_DIR: /state
      ASTER_DISCOVER_LAN: ${ASTER_C_DISCOVER_LAN:-1}
      ASTER_NEARBY_WINDOW: "3"
      ASTER_SYNC_MS: "500"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - c-state:/state

  d:
    <<: *node
    environment:
      ASTER_STATE_DIR: /state
      ASTER_DISCOVER_LAN: ${ASTER_D_DISCOVER_LAN:-1}
      ASTER_NEARBY_WINDOW: "3"
      ASTER_SYNC_MS: "500"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - d-state:/state

networks:
  mesh:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

volumes:
  a-state: {}
  b-state: {}
  c-state: {}
  d-state: {}
