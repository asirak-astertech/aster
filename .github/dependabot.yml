version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Shared workspace pins affect both independently locked Cargo graphs.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      shared-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: gomod
    directory: /tools/age-reference
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
